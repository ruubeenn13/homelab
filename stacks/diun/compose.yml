services:
  diun:
    image: crazymax/diun:4.33.0
    container_name: diun
    restart: unless-stopped
    command: serve
    environment:
      - TZ=Europe/Madrid
      - DIUN_WATCH_SCHEDULE=0 7 * * *
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://socket-proxy:2375
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_NTFY_ENDPOINT=http://ntfy:80
      - DIUN_NOTIF_NTFY_TOPIC=homelab-alerts-03c5d07f
      - DIUN_NOTIF_NTFY_PRIORITY=3
    volumes:
      - ./data:/data
    networks:
      - proxy
      - socket

networks:
  proxy:
    external: true
  socket:
    external: true
    name: traefik_socket
