services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.4
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=n8n.rubenlav.dev
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.rubenlav.dev/
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
    volumes:
      - ./data:/home/node/.n8n
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.rubenlav.dev`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.services.n8n.loadbalancer.server.port=5678

networks:
  proxy:
    external: true
